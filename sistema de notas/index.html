
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Consulta de Notas</title>

    <!-- Conexão com o CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header class="cabecalho">
            <h1>📚 Sistema de Notas</h1>
            <p>Consulte a média e a situação acadêmica do estudante.</p>
        </header>

        <section class="formulario">

            <h2>Dados do estudante</h2>

            <div class="campo">
                <label for="nome">Nome do estudante:</label>
                <input
                    type="text"
                    id="nome"
                    placeholder="Digite o nome do estudante"
                >
            </div>

            <div class="notas">

                <div class="campo">
                    <label for="nota1">Primeira nota:</label>
                    <input
                        type="number"
                        id="nota1"
                        placeholder="0 a 10"
                        min="0"
                        max="10"
                        step="0.1"
                    >
                </div>

                <div class="campo">
                    <label for="nota2">Segunda nota:</label>
                    <input
                        type="number"
                        id="nota2"
                        placeholder="0 a 10"
                        min="0"
                        max="10"
                        step="0.1"
                    >
                </div>

                <div class="campo">
                    <label for="nota3">Terceira nota:</label>
                    <input
                        type="number"
                        id="nota3"
                        placeholder="0 a 10"
                        min="0"
                        max="10"
                        step="0.1"
                    >
                </div>

            </div>

            <div class="botoes">
                <button id="btnCalcular" onclick="calcularMedia()">
                    Calcular média
                </button>

                <button id="btnLimpar" onclick="limparCampos()">
                    Limpar consulta
                </button>
            </div>

            <!-- Área de mensagens e resultados -->
            <div id="resultado" class="resultado"></div>

        </section>

        <footer>
            <p>Sistema de Consulta de Notas © 2026</p>
        </footer>

    </main>

    <!-- Conexão com o JavaScript -->
    <script src="script.js"></script>

</body>
</html>
